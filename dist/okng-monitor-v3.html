<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ระบบเก็บข้อมูลการเทสเครื่องเทียบสี — ติดตาม OK/NG, LOCK, ล็อตงาน และรายงานรายสถานี">
<meta name="theme-color" content="#f4f6fb">
<title>OKNG Monitor v3</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&family=Prompt:wght@400;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   OKNG Monitor v3 — Color Inspection System
   Palette, spacing and component styling follow the source design.
   ========================================================================== */

:root{
  /* Cool blue — the design's default tone */
  --bg:#f4f6fb;
  --panel:#ffffff;
  --ink:#1a1f36;
  --accent:#4f56e0;

  --line:#e8ebf4;
  --soft:#f1f3fa;
  --muted:#6e7490;
  --muted-2:#8a90ab;
  --muted-3:#a2a8c0;

  --ok:#2f9e52;
  --ok-ink:#1f7a41;
  --ok-tint:#e5f5ec;
  --ng:#e0342f;
  --ng-ink:#c62f2f;
  --ng-tint:#fdecec;
  --info:#4f7fe8;
  --info-ink:#2f5fb8;
  --info-tint:#e9eefb;
  --violet:#7c56e0;
  --violet-tint:#efe9fd;
  --clay:#c67139;
  --clay-tint:#fdf0e2;
  --amber:#e0a020;
  --amber-ink:#9a6a08;
  --amber-tint:#fdf3dd;
  --bar-ng:#e8ab2e;

  --radius:16px;
  --radius-sm:10px;
  --font:"Sarabun", system-ui, sans-serif;
  --side-w:212px;
}

:root[data-theme="organic"]{
  --bg:#f5ead8;
  --panel:#fffaf2;
  --ink:#201e1d;
  --accent:#c67139;
  --line:#e7dcc8;
  --soft:#f2e8d7;
  --muted:#7b6f5d;
  --muted-2:#968a76;
  --muted-3:#b2a794;
}

:root[data-theme="night"]{
  --bg:#12151f;
  --panel:#1b2030;
  --ink:#f2f4fa;
  --accent:#7d8bff;
  --line:#2a3145;
  --soft:#232a3c;
  --muted:#98a0bb;
  --muted-2:#7f88a6;
  --muted-3:#6b7490;

  --ok-tint:#16301f;
  --ok-ink:#5fd08a;
  --ng-tint:#3a1a1a;
  --ng-ink:#ff8a84;
  --info-tint:#1b2745;
  --info-ink:#8fb4ff;
  --violet-tint:#241f45;
  --clay-tint:#33251a;
  --amber-tint:#33290f;
  --amber-ink:#f0c060;
}

:root[data-font="prompt"]{ --font:"Prompt", system-ui, sans-serif; }
:root[data-font="plex"]{ --font:"IBM Plex Sans Thai", system-ui, sans-serif; }

:root[data-tv="on"]{ font-size:19px; }

*{box-sizing:border-box}
[hidden]{display:none!important}

html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums}

.skip{position:absolute;left:-9999px;top:0;background:var(--accent);color:#fff;padding:10px 16px;z-index:100;border-radius:0 0 8px 0;font-weight:700}
.skip:focus{left:0}
:where(button,select,input,a):focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* ---------------------------------------------------------------- shell */
.shell{display:flex;min-height:100%}

/* ---------------------------------------------------------------- side */
.side{
  width:var(--side-w);flex:0 0 var(--side-w);
  background:var(--panel);border-right:1px solid var(--line);
  padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(22px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:10px;
  position:sticky;top:0;align-self:flex-start;height:100vh;overflow:auto;
}
.brand{display:flex;align-items:baseline;gap:9px;margin-bottom:6px}
.brand-mark{font-size:15px;font-weight:800;letter-spacing:.02em}
.brand-name{font-size:13px;font-weight:700;color:var(--ink);opacity:.9}

.field{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;color:var(--muted-2)}
.sel{
  width:100%;background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:9px 10px;font:inherit;font-size:13px;font-weight:600;
}
.side-label{
  margin:10px 0 2px;font-size:10.5px;font-weight:800;letter-spacing:.14em;
  color:var(--muted-3);text-transform:none;
}

.b{
  border:0;border-radius:var(--radius-sm);padding:9px 15px;
  font:inherit;font-size:13px;font-weight:700;cursor:pointer;
  background:var(--soft);color:var(--muted);
  transition:filter .15s,transform .08s;
}
.b:hover{filter:brightness(.97)}
.b:active{transform:translateY(1px)}
.b-primary{background:var(--accent);color:#fff}
.b-danger{background:var(--ng-tint);color:var(--ng-ink)}
.b-soft{background:var(--soft);color:var(--muted)}
.b-ghost-light{background:rgba(255,255,255,.2);color:#fff}
.b-sm{padding:7px 12px;font-size:12px}
.b:disabled{opacity:.45;cursor:not-allowed}

.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;
  background:transparent;border:0;border-radius:12px;padding:9px 10px;
  font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;text-align:left;
}
.nav-item:hover{background:var(--soft)}
.nav-item[aria-current="page"]{background:var(--soft);color:var(--ink)}
.nav-ic{
  width:26px;height:26px;flex:0 0 26px;border-radius:9px;
  display:grid;place-items:center;font-size:12px;line-height:1;
}

.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:16px}
.health{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--ok-tint)}
.health-dot{width:9px;height:9px;flex:0 0 9px;border-radius:999px;background:var(--ok);animation:pulse 1.6s ease infinite}
.health-text{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.health-text strong{font-size:12.5px;font-weight:800;color:var(--ok-ink)}
.health-text span{font-size:11px;color:var(--ok-ink);opacity:.8}
.health.is-off{background:var(--amber-tint)}
.health.is-off .health-dot{background:var(--amber);animation:none}
.health.is-off strong,.health.is-off span{color:var(--amber-ink)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------------------------------------------------------------- main */
main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:calc(14px + env(safe-area-inset-top,0px)) 24px 14px;
  border-bottom:1px solid var(--line);background:var(--panel);
  position:sticky;top:0;z-index:20;
}
.crumb{display:flex;align-items:center;gap:8px;margin:0;font-size:13px;color:var(--muted-2);font-weight:600}
.crumb i{font-style:normal;color:var(--muted-3)}
.crumb b{color:var(--ink);font-weight:700}
.search{
  order:9;margin-left:auto;background:var(--soft);border:1px solid transparent;border-radius:var(--radius-sm);
  padding:9px 13px;font:inherit;font-size:13px;color:var(--ink);width:min(260px,32vw);
}
.search::placeholder{color:var(--muted-3)}

.page{padding:22px 24px 24px;display:flex;flex-direction:column;gap:16px;flex:1}
.page-head h1{margin:0;font-size:29px;font-weight:800;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.page-head p{margin:4px 0 0;font-size:13px;color:var(--muted-2)}

/* lock banner */
.lock{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--ng);color:#fff;border-radius:var(--radius);padding:16px 22px;
}
.lock-dot{width:10px;height:10px;flex:0 0 10px;border-radius:999px;background:rgba(255,255,255,.75);animation:pulse 1.2s ease infinite}
.lock-text{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.lock-text strong{font-size:17px;font-weight:800}
.lock-text span{font-size:13px;opacity:.92}
.lock .b{margin-left:auto}

/* ---------------------------------------------------------------- cards */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px 14px;min-width:0;
}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.card-head h2{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em}
.card-head p{margin:2px 0 0;font-size:12px;color:var(--muted-2)}
.card-note{font-size:12px;color:var(--muted-3);font-weight:600;white-space:nowrap}

.grid-kpi{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi-top{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.kpi-ic{width:24px;height:24px;flex:0 0 24px;border-radius:8px;display:grid;place-items:center;font-size:12px;line-height:1}
.kpi-label{font-size:12.5px;font-weight:700;color:var(--muted-2)}
.kpi-val{display:flex;align-items:baseline;gap:6px}
.kpi-val b{font-size:31px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.kpi-val span{font-size:12.5px;color:var(--muted-2);font-weight:600}
.kpi-rule{height:3px;border-radius:99px;margin:10px 0 10px}
.chip{
  display:inline-block;padding:3px 10px;border-radius:999px;
  font-size:11.5px;font-weight:700;white-space:nowrap;
}

.grid-2{display:grid;gap:14px;grid-template-columns:2fr 1fr}
.grid-2b{display:grid;gap:14px;grid-template-columns:1fr 1.7fr}

/* bar chart */
.legend{display:flex;gap:14px;font-size:11.5px;font-weight:700;color:var(--muted-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.bars{display:flex;align-items:flex-end;gap:10px;height:212px;padding-top:18px;overflow-x:auto}
.bar-col{flex:1;min-width:34px;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar-pair{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center}
.bar-ok{width:16px;border-radius:5px 5px 0 0;background:var(--info);position:relative}
.bar-ok::after{
  content:attr(data-v);position:absolute;top:-17px;left:50%;transform:translateX(-50%);
  font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;
}
.bar-ng{width:8px;border-radius:4px 4px 0 0;background:var(--bar-ng)}
.bar-h{font-size:11px;color:var(--muted-3);font-variant-numeric:tabular-nums}

/* gauge */
.gauge-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.gauge{width:100%;max-width:230px;height:auto;overflow:visible}
.gauge-track{fill:none;stroke:var(--line);stroke-width:22;stroke-linecap:round}
.gauge-fill{fill:none;stroke:var(--accent);stroke-width:22;stroke-linecap:round;transition:stroke-dasharray .5s cubic-bezier(.22,1,.36,1)}
.gauge-val{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:-34px}
.gauge-sub{font-size:12.5px;color:var(--muted-2);font-weight:600;margin-bottom:6px}
.rows{display:flex;flex-direction:column;gap:0;margin-top:8px}
.rows div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.rows div:first-child{border-top:0}
.rows span{color:var(--muted-2)}
.rows b{font-weight:700;font-variant-numeric:tabular-nums}

/* I/O */
.io{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.io-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px}
.io-dot{width:8px;height:8px;flex:0 0 8px;border-radius:999px}
.io-pin{font-size:11.5px;font-weight:800;min-width:52px;font-variant-numeric:tabular-nums}
.io-name{font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.io-state{font-size:11.5px;font-weight:700;white-space:nowrap}
.big-stat{font-size:12px;color:var(--muted-2);font-weight:700}
.big-stat b{display:block;font-size:34px;font-weight:800;color:var(--ink);letter-spacing:-.03em;line-height:1.1;margin-top:2px}
.big-stat b small{font-size:14px;font-weight:600;color:var(--muted-2);letter-spacing:0}
.big-hint{margin:6px 0 0;font-size:12.5px;color:var(--muted-2)}

/* trend */
.trend{width:100%;height:150px;display:block;overflow:visible}
.trend-area{fill:var(--ok-tint)}
.trend-line{fill:none;stroke:var(--ok);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.trend-axis{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--muted-3);margin-top:8px;font-variant-numeric:tabular-nums}

/* table */
.tbl-wrap{overflow:auto;max-height:420px;margin:0 -18px -14px;padding:0 18px}
.tbl-wrap thead th{position:sticky;top:0;z-index:1;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
thead th{
  text-align:left;padding:10px 12px;font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted-2);border-bottom:1px solid var(--line);white-space:nowrap;
}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
.t-right{text-align:right;font-variant-numeric:tabular-nums}
.t-ok{color:var(--ok-ink);font-weight:700}
.t-ng{color:var(--ng-ink);font-weight:700}
.t-id{font-weight:700}

/* log view */
.log-list{display:flex;flex-direction:column;gap:7px}
.log-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;background:var(--soft)}
.log-dot{width:8px;height:8px;flex:0 0 8px;border-radius:999px}
.log-type{font-size:12.5px;font-weight:700}
.log-time{margin-left:auto;font-size:12.5px;color:var(--muted-2);font-variant-numeric:tabular-nums}
.log-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.log-actions .b{padding:11px 18px;font-size:14px}

/* lots */
.lots{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.lot{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 15px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:8px}
.lot:hover{border-color:var(--accent)}
.lot-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lot-id{font-size:14px;font-weight:800}
.lot-id small{display:block;font-size:11.5px;font-weight:500;color:var(--muted-2)}
.lot-pct{font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.lot-bar{height:7px;border-radius:99px;background:var(--soft);overflow:hidden}
.lot-bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.lot-meta{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--muted-2);font-variant-numeric:tabular-nums}

/* report totals */
.grid-tot{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.tot-label{font-size:12.5px;font-weight:700;color:var(--muted-2)}
.tot-val{font-size:29px;font-weight:800;letter-spacing:-.03em;margin-top:4px;line-height:1.1}

.empty{padding:26px 12px;text-align:center;color:var(--muted-3);font-size:13px}

.foot{
  display:flex;gap:12px;flex-wrap:wrap;margin-top:auto;padding-top:6px;
  font-size:12px;color:var(--muted-3);
}
.foot span:last-child{margin-left:auto}

/* ---------------------------------------------------------------- responsive */
@media (max-width:1080px){
  .grid-2,.grid-2b{grid-template-columns:1fr}
}
@media (max-width:860px){
  .shell{flex-direction:column}
  .side{
    width:100%;flex:none;height:auto;position:static;
    border-right:0;border-bottom:1px solid var(--line);
  }
  .side-foot{margin-top:14px}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav-item{width:auto}
  .topbar{padding-left:16px;padding-right:16px}
  .page{padding:18px 16px 20px}
  .search{width:100%;order:3;margin-left:0}
  .page-head h1{font-size:24px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<a class="skip" href="#main">ข้ามไปเนื้อหาหลัก</a>

<div class="shell">

  <!-- ===================== sidebar ===================== -->
  <aside class="side">
    <div class="brand">
      <span class="brand-mark">HET</span>
      <span class="brand-name">เครื่องเทียบสี</span>
    </div>

    <label class="field">สถานี
      <select id="stationSelect" class="sel"></select>
    </label>

    <button id="btnRemove" class="b b-danger" type="button">ลบสถานีนี้</button>
    <button id="btnRestore" class="b b-soft" type="button">คืนค่าสถานีที่ลบ</button>

    <p class="side-label">เมนูหลัก</p>
    <nav id="nav" class="nav" aria-label="เมนูหลัก"></nav>

    <div class="side-foot">
      <div id="health" class="health">
        <span class="health-dot" aria-hidden="true"></span>
        <div class="health-text">
          <strong>สถานะเครื่อง</strong>
          <span id="healthText">heartbeat ปกติ</span>
        </div>
      </div>

      <label class="field">โทนสี
        <select id="themeSelect" class="sel">
          <option value="cool">Cool blue</option>
          <option value="organic">Organic cream</option>
          <option value="night">Night (จอ TV)</option>
        </select>
      </label>

      <label class="field">ตัวหนังสือ
        <select id="fontSelect" class="sel">
          <option value="sarabun">Sarabun</option>
          <option value="prompt">Prompt</option>
          <option value="plex">IBM Plex Sans Thai</option>
        </select>
      </label>

      <button id="btnTv" class="b b-soft" type="button">โหมด TV</button>
    </div>
  </aside>

  <!-- ===================== main ===================== -->
  <main id="main">
    <header class="topbar">
      <p class="crumb"><span>ระบบเก็บข้อมูลการเทส</span><i aria-hidden="true">›</i><b id="crumbView">แดชบอร์ด</b></p>
      <button id="btnRefresh" class="b b-soft" type="button">⟳ รีเฟรช</button>
      <button id="btnExport" class="b b-primary" type="button">↓ Export CSV</button>
      <input id="search" class="search" type="search" placeholder="ค้นหา event / สถานี…" aria-label="ค้นหา event หรือสถานี">
    </header>

    <div class="page">
      <div class="page-head">
        <h1 id="stationTitle">—</h1>
        <p id="stationSub">ภาพรวมผลการเทสวันนี้</p>
      </div>

      <section id="lockBanner" class="lock" role="status" hidden>
        <span class="lock-dot" aria-hidden="true"></span>
        <div class="lock-text">
          <strong>LOCK — ของเสียยังไม่เข้ากล่อง</strong>
          <span id="lockDetail"></span>
        </div>
        <button id="btnClearLock" class="b b-ghost-light" type="button">เคลียร์ NG/LOCK</button>
      </section>

      <div id="view"></div>

      <footer class="foot">
        <span>Color Inspection System · Supabase Realtime</span>
        <span id="stationCount">—</span>
      </footer>
    </div>
  </main>

</div>
<script>
/* ==========================================================================
   OKNG Monitor v3 — Color Inspection System
   Vanilla JS port of the source design's component logic.
   ========================================================================== */
(function () {
  'use strict';

  var NAMES = ['Press A1', 'Press A2', 'Weld B1', 'Weld B2', 'Assy C1', 'Assy C2',
               'Inspect D1', 'Inspect D2', 'Paint E1', 'Pack F1', 'Pack F2', 'Trim G1'];

  var NAV = [
    { label: 'แดชบอร์ด', icon: '▤', tint: '#e7e9fd', ink: '#4f56e0' },
    { label: 'บันทึกผล', icon: '✎', tint: '#e5f5ec', ink: '#2f9e52' },
    { label: 'ประวัติ',  icon: '≡', tint: '#e9eefb', ink: '#3f74d8' },
    { label: 'ล็อตงาน',  icon: '▦', tint: '#fdf0e2', ink: '#c67139' },
    { label: 'รายงาน',   icon: '◈', tint: '#fdeaf1', ink: '#c8407a' }
  ];

  var STATION_COUNT = 11;

  var fmt = function (n) { return n.toLocaleString('en-US'); };
  var pad2 = function (n) { return String(n).padStart(2, '0'); };
  var hhmm = function (d) { return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
  var thDate = function (ts) {
    return new Date(ts).toLocaleString('th-TH', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  };
  var esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };

  /* ---------------------------------------------------------------- state */

  var S = {
    all: [], st: [], removed: [], sel: null,
    series: {}, events: {},
    view: 'แดชบอร์ด', q: '',
    theme: 'cool', font: 'sarabun', tv: false,
    clock: hhmm(new Date())
  };

  function buildStations() {
    var st = [];
    for (var i = 0; i < STATION_COUNT; i++) {
      var ok = 40 + Math.floor(Math.random() * 900);
      var ng = 2 + Math.floor(Math.random() * 24);
      st.push({
        id: 'ST-' + String(i + 1).padStart(3, '0'),
        name: NAMES[i % NAMES.length],
        ok: ok, ng: ng, ngBox: ng, setting: 1000,
        rate: 1.6 + Math.random() * 2.4,
        downtime: Math.random() * 4,
        lockSec: 0, offline: false
      });
    }
    // the design opens with station 1 locked and station 6 off the air
    st[0].ng = st[0].ngBox + 1;
    st[0].lockSec = 6;
    if (st[5]) st[5].offline = true;
    return st;
  }

  function seedEvents(s) {
    var out = [], t = Date.now(), ng = s.ng, box = s.ngBox;
    for (var i = 0; i < 40; i++) {
      t -= (2 + Math.random() * 16) * 60000;
      out.push({
        ts: t, type: i % 4 === 3 ? 'NG_BOXED' : 'NG',
        ok: Math.max(s.ok - i * 7, 0), ng: ng--, box: box--
      });
    }
    return out;
  }

  function hoursOf(s) {
    if (!S.series[s.id]) {
      var hours = [];
      for (var i = 11; i >= 0; i--) {
        var h = new Date(Date.now() - i * 3600000);
        var ok = Math.max(2, Math.round(s.rate * 60 * (0.5 + Math.random() * 0.7) / 8));
        hours.push({ h: h, ok: ok, ng: Math.max(0, Math.round(ok * (0.01 + Math.random() * 0.12))) });
      }
      S.series[s.id] = hours;
    }
    return S.series[s.id];
  }

  function current() {
    return S.st.filter(function (x) { return x.id === S.sel; })[0] || S.st[0] || null;
  }

  /* ------------------------------------------------------------- elements */

  var $ = function (id) { return document.getElementById(id); };
  var el = {
    side: $('stationSelect'), nav: $('nav'), view: $('view'),
    crumb: $('crumbView'), title: $('stationTitle'), sub: $('stationSub'),
    lock: $('lockBanner'), lockDetail: $('lockDetail'), btnClearLock: $('btnClearLock'),
    health: $('health'), healthText: $('healthText'), count: $('stationCount'),
    search: $('search'), btnRemove: $('btnRemove'), btnRestore: $('btnRestore'),
    btnRefresh: $('btnRefresh'), btnExport: $('btnExport'), btnTv: $('btnTv'),
    theme: $('themeSelect'), font: $('fontSelect')
  };

  /* -------------------------------------------------------------- chrome */

  function renderNav() {
    el.nav.innerHTML = NAV.map(function (n) {
      var on = S.view === n.label;
      return '<button class="nav-item" type="button" data-view="' + esc(n.label) + '"' +
        (on ? ' aria-current="page"' : '') + '>' +
        '<span class="nav-ic" style="background:' + n.tint + ';color:' + n.ink + '">' + n.icon + '</span>' +
        esc(n.label) + '</button>';
    }).join('');
  }

  function renderStationSelect() {
    el.side.innerHTML = S.st.map(function (x) {
      return '<option value="' + esc(x.id) + '"' + (x.id === S.sel ? ' selected' : '') + '>' +
        esc(x.id + ' · ' + x.name) + '</option>';
    }).join('');
    el.btnRemove.disabled = S.st.length <= 1;
    el.btnRestore.disabled = !S.removed.length;
    el.count.textContent = S.st.length + ' สถานี' + (S.removed.length ? ' · ลบไป ' + S.removed.length : '');
  }

  function renderHeader(s) {
    el.crumb.textContent = S.view;
    el.title.textContent = s ? s.id + ' · ' + s.name : 'ไม่มีสถานี';
    el.sub.textContent = 'ภาพรวมผลการเทสวันนี้ — อัปเดตล่าสุด ' + S.clock;

    var locked = s && s.ng > s.ngBox;
    el.lock.hidden = !locked;
    if (locked) {
      el.lockDetail.textContent = s.id + ' ค้าง ' + (s.ng - s.ngBox) + ' ชิ้น · LOCK ' + s.lockSec + ' วินาที';
    }

    var off = s && s.offline;
    el.health.classList.toggle('is-off', !!off);
    el.healthText.textContent = off ? 'ไม่มีข้อมูลใหม่ 3 นาที' : 'heartbeat ปกติ';
  }

  /* --------------------------------------------------------------- views */

  function kpisOf(s) {
    var total = s.ok + s.ng;
    var locked = s.ng > s.ngBox;
    var eta = s.rate > 0 ? (s.setting - s.ok) / s.rate : 0;
    return [
      { label: 'OK สะสม', value: fmt(s.ok), unit: 'ชิ้น', icon: '✓', edge: '#2f9e52', tint: 'var(--ok-tint)', tagInk: 'var(--ok-ink)', tag: 'ผ่านการตรวจสีครบ' },
      { label: 'NG สะสม', value: fmt(s.ng), unit: 'ชิ้น', icon: '✕', edge: '#e0342f', tint: 'var(--ng-tint)', tagInk: 'var(--ng-ink)', tag: locked ? 'ค้าง ' + (s.ng - s.ngBox) + ' ชิ้น' : 'เข้ากล่องครบ' },
      { label: 'Yield', value: (total ? s.ok / total * 100 : 100).toFixed(1) + '%', unit: '', icon: '%', edge: '#4f7fe8', tint: 'var(--info-tint)', tagInk: 'var(--info-ink)', tag: 'OK / ทั้งหมด' },
      { label: 'อัตราผลิต', value: s.offline ? '0.0' : s.rate.toFixed(1), unit: 'ชิ้น/นาที', icon: '⚡', edge: '#7c56e0', tint: 'var(--violet-tint)', tagInk: '#7c56e0', tag: 'ETA ' + Math.max(eta, 0).toFixed(1) + ' นาที' },
      { label: 'Downtime วันนี้', value: s.downtime.toFixed(1), unit: 'นาที', icon: '◔', edge: '#c67139', tint: 'var(--clay-tint)', tagInk: '#c67139', tag: 'LOCK สะสม' }
    ];
  }

  function kpiHtml(k) {
    return '<article class="card">' +
      '<div class="kpi-top">' +
        '<span class="kpi-ic" style="background:' + k.tint + ';color:' + k.edge + '">' + k.icon + '</span>' +
        '<span class="kpi-label">' + esc(k.label) + '</span>' +
      '</div>' +
      '<div class="kpi-val"><b class="num">' + esc(k.value) + '</b>' +
        (k.unit ? '<span>' + esc(k.unit) + '</span>' : '') + '</div>' +
      '<div class="kpi-rule" style="background:' + k.edge + '"></div>' +
      '<span class="chip" style="background:' + k.tint + ';color:' + k.tagInk + '">' + esc(k.tag) + '</span>' +
      '</article>';
  }

  function ioOf(s, locked, pct) {
    return [
      { pin: 'D9', name: 'เซ็นเซอร์ตรวจพบสี', dot: s.offline ? '#c3c8d8' : '#2f9e52', state: s.offline ? 'ไม่มีสัญญาณ' : 'ว่าง', tint: s.offline ? 'var(--soft)' : 'var(--ok-tint)', ink: s.offline ? 'var(--muted)' : 'var(--ok-ink)' },
      { pin: 'D11', name: 'OK output', dot: '#4f7fe8', state: 'ว่าง', tint: 'var(--info-tint)', ink: 'var(--info-ink)' },
      { pin: 'D12', name: 'NG / LOCK', dot: locked ? '#e0342f' : '#c3c8d8', state: locked ? 'LOCK' : 'ปกติ', tint: locked ? 'var(--ng-tint)' : 'var(--soft)', ink: locked ? 'var(--ng-ink)' : 'var(--muted)' },
      { pin: 'D5 / D6', name: 'Full counter', dot: pct >= 100 ? '#e0a020' : '#c3c8d8', state: pct >= 100 ? 'ครบล็อต' : 'ยังไม่ครบ', tint: pct >= 100 ? 'var(--amber-tint)' : 'var(--soft)', ink: pct >= 100 ? 'var(--amber-ink)' : 'var(--muted)' }
    ];
  }

  function viewDashboard(s) {
    var locked = s.ng > s.ngBox;
    var pct = Math.min(s.ok / Math.max(s.setting, 1) * 100, 100);
    var eta = s.rate > 0 ? (s.setting - s.ok) / s.rate : 0;
    var hours = hoursOf(s);
    var maxBar = Math.max.apply(null, hours.map(function (h) { return h.ok + h.ng; }).concat([1]));

    var bars = hours.map(function (h) {
      var tot = h.ok + h.ng;
      return '<div class="bar-col">' +
        '<div class="bar-pair">' +
          '<i class="bar-ok" data-v="' + tot + '" style="height:' + Math.max(8, tot / maxBar * 168).toFixed(0) + 'px"></i>' +
          '<i class="bar-ng" style="height:' + Math.max(4, h.ng / maxBar * 168).toFixed(0) + 'px"></i>' +
        '</div>' +
        '<span class="bar-h">' + pad2(h.h.getHours()) + '</span>' +
        '</div>';
    }).join('');

    // yield trend polyline over the same 12 hours
    var pts = hours.map(function (h, i) {
      var y = (h.ok + h.ng) ? h.ok / (h.ok + h.ng) * 100 : 100;
      return (i / 11 * 470 + 5).toFixed(1) + ',' + (140 - y / 100 * 120).toFixed(1);
    }).join(' ');

    var io = ioOf(s, locked, pct).map(function (r) {
      return '<div class="io-row" style="background:' + r.tint + '">' +
        '<span class="io-dot" style="background:' + r.dot + '"></span>' +
        '<span class="io-pin" style="color:' + r.ink + '">' + esc(r.pin) + '</span>' +
        '<span class="io-name">' + esc(r.name) + '</span>' +
        '<span class="io-state" style="color:' + r.ink + '">' + esc(r.state) + '</span>' +
        '</div>';
    }).join('');

    var evs = eventsFor(s);

    return '<section class="grid-kpi">' + kpisOf(s).map(kpiHtml).join('') + '</section>' +

      '<section class="grid-2">' +
        '<article class="card">' +
          '<div class="card-head"><div><h2>OK / NG รายชั่วโมง</h2>' +
            '<p>12 ชั่วโมงที่ผ่านมา · ' + hhmm(hours[0].h) + ' → ' + hhmm(hours[hours.length - 1].h) + '</p></div>' +
            '<div class="legend"><span><i style="background:var(--info)"></i>OK</span>' +
            '<span><i style="background:var(--bar-ng)"></i>NG</span></div></div>' +
          '<div class="bars">' + bars + '</div>' +
        '</article>' +
        '<article class="card">' +
          '<div class="card-head"><div><h2>ความก้าวหน้าของล็อต</h2><p>Counting vs Setting</p></div></div>' +
          '<div class="gauge-wrap">' +
            '<svg class="gauge" viewBox="0 0 200 110" aria-hidden="true">' +
              '<path class="gauge-track" d="M15 100 A85 85 0 0 1 185 100"/>' +
              '<path class="gauge-fill" d="M15 100 A85 85 0 0 1 185 100" ' +
                'style="stroke-dasharray:' + (pct / 100 * 267).toFixed(1) + ' 267"/>' +
            '</svg>' +
            '<strong class="gauge-val num">' + Math.round(pct) + '%</strong>' +
            '<span class="gauge-sub num">' + fmt(s.ok) + ' / ' + fmt(s.setting) + ' pcs</span>' +
          '</div>' +
          '<div class="rows">' +
            '<div><span>อัตราผลิต</span><b>' + s.rate.toFixed(1) + ' ชิ้น/นาที</b></div>' +
            '<div><span>คาดว่าจะครบใน</span><b>' + Math.max(eta, 0).toFixed(1) + ' นาที</b></div>' +
            '<div><span>Downtime วันนี้</span><b>' + s.downtime.toFixed(1) + ' นาที</b></div>' +
          '</div>' +
        '</article>' +
      '</section>' +

      '<section class="grid-2b">' +
        '<article class="card">' +
          '<div class="card-head"><div><h2>สถานะ I/O</h2></div></div>' +
          '<p class="big-stat">LOCK ต่อเนื่องขณะนี้<b class="num">' + s.lockSec + '<small> วินาที</small></b></p>' +
          '<p class="big-hint">' + (locked ? 'ต้องนำ NG เข้ากล่องเพื่อปลดล็อก' : 'ยังไม่มี NG ค้างในกะนี้') + '</p>' +
          '<div class="io">' + io + '</div>' +
        '</article>' +
        '<article class="card">' +
          '<div class="card-head"><div><h2>Yield Trend</h2><p>เปอร์เซ็นต์ OK รายชั่วโมง</p></div></div>' +
          '<svg class="trend" viewBox="0 0 480 150" preserveAspectRatio="none" role="img" aria-label="แนวโน้ม Yield">' +
            '<polygon class="trend-area" points="5,140 ' + pts + ' 475,140"/>' +
            '<polyline class="trend-line" points="' + pts + '"/>' +
          '</svg>' +
          '<div class="trend-axis"><span>' + hhmm(hours[0].h) + '</span><span>100 · 50 · 0 %</span>' +
            '<span>' + hhmm(hours[hours.length - 1].h) + '</span></div>' +
        '</article>' +
      '</section>' +

      '<article class="card">' +
        '<div class="card-head"><div><h2>NG events ล่าสุด</h2></div>' +
          '<span class="card-note">' + fmt(evs.length) + ' รายการ</span></div>' +
        (evs.length ? '<div class="tbl-wrap"><table><thead><tr>' +
          '<th>เวลา</th><th>ชนิด</th><th class="t-right">OK</th><th class="t-right">NG</th><th class="t-right">ในกล่อง</th>' +
          '</tr></thead><tbody>' + evs.map(function (e) {
            return '<tr><td class="num">' + esc(thDate(e.ts)) + '</td>' +
              '<td>' + typeTag(e.type) + '</td>' +
              '<td class="t-right">' + fmt(e.ok) + '</td>' +
              '<td class="t-right">' + fmt(Math.max(e.ng, 0)) + '</td>' +
              '<td class="t-right">' + fmt(Math.max(e.box, 0)) + '</td></tr>';
          }).join('') + '</tbody></table></div>'
        : '<p class="empty">ไม่พบ event ที่ตรงกับคำค้น</p>') +
      '</article>';
  }

  function typeTag(t) {
    var boxed = t === 'NG_BOXED';
    return '<span class="chip" style="background:' + (boxed ? 'var(--ok-tint)' : 'var(--ng-tint)') +
      ';color:' + (boxed ? 'var(--ok-ink)' : 'var(--ng-ink)') + '">' + esc(t) + '</span>';
  }

  function eventsFor(s) {
    var all = S.events[s.id] || [];
    var q = S.q.toLowerCase();
    if (!q) return all;
    return all.filter(function (e) {
      return (e.type + ' ' + thDate(e.ts)).toLowerCase().indexOf(q) !== -1;
    });
  }

  function viewLog(s) {
    var recent = (S.events[s.id] || []).slice(0, 10);
    return '<div class="log-actions">' +
        '<button class="b b-primary" type="button" data-act="addOk">+ บันทึก OK</button>' +
        '<button class="b b-danger" type="button" data-act="addNg">+ บันทึก NG</button>' +
      '</div>' +
      '<article class="card">' +
        '<div class="card-head"><div><h2>10 รายการที่บันทึกล่าสุด</h2></div>' +
          '<span class="card-note">OK ' + fmt(s.ok) + ' · NG ' + fmt(s.ng) + '</span></div>' +
        (recent.length ? '<div class="log-list">' + recent.map(function (e) {
          var boxed = e.type === 'NG_BOXED';
          return '<div class="log-row">' +
            '<span class="log-dot" style="background:' + (boxed ? '#2f9e52' : '#e0342f') + '"></span>' +
            '<span class="log-type">' + esc(e.type) + '</span>' +
            '<span class="log-time">' + esc(thDate(e.ts)) + '</span></div>';
        }).join('') + '</div>' : '<p class="empty">ยังไม่มีรายการที่บันทึก</p>') +
      '</article>';
  }

  function viewHistory() {
    var rows = [];
    S.st.forEach(function (x) {
      (S.events[x.id] || []).forEach(function (e) { rows.push({ station: x.id, e: e }); });
    });
    rows.sort(function (a, b) { return b.e.ts - a.e.ts; });
    var q = S.q.toLowerCase();
    rows = rows.map(function (r) {
      return { station: r.station, type: r.e.type, time: thDate(r.e.ts),
        ok: r.e.ok, ng: Math.max(r.e.ng, 0), box: Math.max(r.e.box, 0) };
    }).filter(function (r) {
      return !q || (r.station + ' ' + r.type + ' ' + r.time).toLowerCase().indexOf(q) !== -1;
    }).slice(0, 300);

    return '<article class="card">' +
      '<div class="card-head"><div><h2>ประวัติ event ทุกสถานี</h2>' +
        '<p>' + fmt(rows.length) + ' รายการ · กรองด้วยช่องค้นหาด้านบน</p></div></div>' +
      (rows.length ? '<div class="tbl-wrap"><table><thead><tr>' +
        '<th>เวลา</th><th>สถานี</th><th>ชนิด</th><th class="t-right">OK</th><th class="t-right">NG</th><th class="t-right">ในกล่อง</th>' +
        '</tr></thead><tbody>' + rows.map(function (r) {
          return '<tr><td class="num">' + esc(r.time) + '</td>' +
            '<td class="t-id">' + esc(r.station) + '</td>' +
            '<td>' + typeTag(r.type) + '</td>' +
            '<td class="t-right">' + fmt(r.ok) + '</td>' +
            '<td class="t-right">' + fmt(r.ng) + '</td>' +
            '<td class="t-right">' + fmt(r.box) + '</td></tr>';
        }).join('') + '</tbody></table></div>'
      : '<p class="empty">ไม่พบ event ที่ตรงกับคำค้น</p>') +
      '</article>';
  }

  function viewLots() {
    return '<div class="lots">' + S.st.map(function (x) {
      var p = Math.min(x.ok / Math.max(x.setting, 1) * 100, 100);
      var lk = x.ng > x.ngBox;
      var edge = lk ? '#e0342f' : p >= 100 ? '#e0a020' : x.offline ? '#8a90ab' : '#2f9e52';
      var tint = lk ? 'var(--ng-tint)' : p >= 100 ? 'var(--amber-tint)' : x.offline ? 'var(--soft)' : 'var(--ok-tint)';
      var status = lk ? 'LOCK' : x.offline ? 'NO SIGNAL' : p >= 100 ? 'ครบล็อต' : 'กำลังผลิต';
      return '<button class="lot" type="button" data-lot="' + esc(x.id) + '">' +
        '<div class="lot-head"><span class="lot-id">' + esc(x.id) + '<small>' + esc(x.name) + '</small></span>' +
          '<span class="chip" style="background:' + tint + ';color:' + edge + '">' + esc(status) + '</span></div>' +
        '<div class="lot-head"><span class="lot-pct" style="color:' + edge + '">' + Math.round(p) + '%</span>' +
          '<span class="lot-meta num">' + fmt(x.ok) + ' / ' + fmt(x.setting) + ' pcs</span></div>' +
        '<div class="lot-bar"><i style="width:' + p.toFixed(1) + '%;background:' + edge + '"></i></div>' +
        '<div class="lot-meta"><span>OK ' + fmt(x.ok) + '</span><span>NG ' + fmt(x.ng) + '</span>' +
          '<span>ETA ' + (x.rate > 0 ? Math.max((x.setting - x.ok) / x.rate, 0).toFixed(1) + ' นาที' : '—') + '</span></div>' +
        '</button>';
    }).join('') + '</div>';
  }

  function reportRows() {
    return S.st.map(function (x) {
      var t = x.ok + x.ng, lk = x.ng > x.ngBox;
      return {
        id: x.id, name: x.name, ok: x.ok, ng: x.ng,
        ngPct: (t ? x.ng / t * 100 : 0).toFixed(2),
        yield: (t ? x.ok / t * 100 : 100).toFixed(1),
        status: lk ? 'LOCK' : x.offline ? 'NO SIGNAL' : 'ปกติ',
        edge: lk ? 'var(--ng-ink)' : x.offline ? 'var(--muted)' : 'var(--ok-ink)',
        tint: lk ? 'var(--ng-tint)' : x.offline ? 'var(--soft)' : 'var(--ok-tint)'
      };
    });
  }

  function viewReport() {
    var rows = reportRows();
    var repOk = S.st.reduce(function (a, x) { return a + x.ok; }, 0);
    var repNg = S.st.reduce(function (a, x) { return a + x.ng; }, 0);
    var totals = [
      { label: 'สถานีที่มอนิเตอร์', value: fmt(S.st.length), ink: 'var(--ink)' },
      { label: 'OK รวม', value: fmt(repOk), ink: 'var(--ok-ink)' },
      { label: 'NG รวม', value: fmt(repNg), ink: 'var(--ng-ink)' },
      { label: 'Yield รวม', value: (repOk + repNg ? repOk / (repOk + repNg) * 100 : 100).toFixed(1) + '%', ink: 'var(--accent)' }
    ];

    return '<section class="grid-tot">' + totals.map(function (t) {
        return '<article class="card"><span class="tot-label">' + esc(t.label) + '</span>' +
          '<div class="tot-val num" style="color:' + t.ink + '">' + esc(t.value) + '</div></article>';
      }).join('') + '</section>' +
      '<article class="card">' +
        '<div class="card-head"><div><h2>สรุปรายสถานี</h2></div>' +
          '<button class="b b-primary b-sm" type="button" data-act="exportReport">↓ Export รายงาน CSV</button></div>' +
        '<div class="tbl-wrap"><table><thead><tr>' +
          '<th>สถานี</th><th>ชื่อ</th><th class="t-right">OK</th><th class="t-right">NG</th>' +
          '<th class="t-right">%NG</th><th class="t-right">Yield</th><th>สถานะ</th>' +
        '</tr></thead><tbody>' + rows.map(function (r) {
          return '<tr><td class="t-id">' + esc(r.id) + '</td><td>' + esc(r.name) + '</td>' +
            '<td class="t-right t-ok">' + fmt(r.ok) + '</td>' +
            '<td class="t-right t-ng">' + fmt(r.ng) + '</td>' +
            '<td class="t-right">' + r.ngPct + '%</td>' +
            '<td class="t-right">' + r.yield + '%</td>' +
            '<td><span class="chip" style="background:' + r.tint + ';color:' + r.edge + '">' + esc(r.status) + '</span></td></tr>';
        }).join('') + '</tbody></table></div>' +
      '</article>';
  }

  /* -------------------------------------------------------------- render */

  function render() {
    var s = current();
    renderStationSelect();
    renderNav();
    renderHeader(s);

    if (!s) {
      el.view.innerHTML = '<article class="card"><p class="empty">ลบสถานีไปหมดแล้ว — กด “คืนค่าสถานีที่ลบ” เพื่อเรียกคืน</p></article>';
      return;
    }
    if (S.view === 'บันทึกผล') el.view.innerHTML = viewLog(s);
    else if (S.view === 'ประวัติ') el.view.innerHTML = viewHistory();
    else if (S.view === 'ล็อตงาน') el.view.innerHTML = viewLots();
    else if (S.view === 'รายงาน') el.view.innerHTML = viewReport();
    else el.view.innerHTML = viewDashboard(s);
  }

  /* -------------------------------------------------------------- export */

  var hostDownloads = null;

  function saveCsv(name, rows) {
    var text = '﻿' + rows.map(function (r) { return r.join(','); }).join('\n');
    if (hostDownloads) {
      hostDownloads.save({ filename: name, data: text }).catch(function (err) {
        var code = err && err.code;
        if (code === 'declined' || code === 'rate_limited') return;
        window.alert('บันทึกไฟล์ไม่สำเร็จ (' + (code || 'error') + ')');
      });
      return;
    }
    var url = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8;' }));
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function exportEvents() {
    var s = current();
    if (!s) return;
    var rows = [['time', 'type', 'ok', 'ng', 'in_box']].concat(
      (S.events[s.id] || []).map(function (e) {
        return [new Date(e.ts).toISOString(), e.type, e.ok, Math.max(e.ng, 0), Math.max(e.box, 0)];
      }));
    saveCsv(s.id + '-events.csv', rows);
  }

  function exportReport() {
    var rows = [['station', 'name', 'ok', 'ng', 'ng_pct', 'yield', 'status']].concat(
      reportRows().map(function (r) { return [r.id, r.name, r.ok, r.ng, r.ngPct, r.yield, r.status]; }));
    saveCsv('station-report.csv', rows);
  }

  /* ------------------------------------------------------------- actions */

  function patch(id, fn) {
    S.st = S.st.map(function (x) { return x.id === id ? fn(x) : x; });
  }

  function applyLook() {
    document.documentElement.setAttribute('data-theme', S.theme);
    document.documentElement.setAttribute('data-font', S.font);
    document.documentElement.setAttribute('data-tv', S.tv ? 'on' : 'off');
    el.btnTv.textContent = S.tv ? 'ออกจากโหมด TV' : 'โหมด TV';
    try {
      localStorage.setItem('okng-look', JSON.stringify({ theme: S.theme, font: S.font, tv: S.tv }));
    } catch (e) { /* ignore */ }
  }

  function bind() {
    el.nav.addEventListener('click', function (e) {
      var b = e.target.closest('[data-view]');
      if (!b) return;
      S.view = b.dataset.view;
      render();
    });

    el.side.addEventListener('change', function () { S.sel = this.value; render(); });

    el.btnRemove.addEventListener('click', function () {
      var s = current();
      if (!s || S.st.length <= 1) return;
      S.st = S.st.filter(function (x) { return x.id !== s.id; });
      S.removed = S.removed.concat(s.id);
      S.sel = S.st.length ? S.st[0].id : null;
      render();
    });

    el.btnRestore.addEventListener('click', function () {
      S.st = S.all.slice();
      S.removed = [];
      if (!S.sel || !current()) S.sel = S.st[0].id;
      render();
    });

    el.btnClearLock.addEventListener('click', function () {
      var s = current();
      if (!s) return;
      patch(s.id, function (x) { return Object.assign({}, x, { ngBox: x.ng, lockSec: 0 }); });
      render();
    });

    el.btnRefresh.addEventListener('click', function () { S.clock = hhmm(new Date()); render(); });
    el.btnExport.addEventListener('click', exportEvents);

    el.search.addEventListener('input', function () { S.q = this.value; render(); });

    el.theme.addEventListener('change', function () { S.theme = this.value; applyLook(); });
    el.font.addEventListener('change', function () { S.font = this.value; applyLook(); });
    el.btnTv.addEventListener('click', function () { S.tv = !S.tv; applyLook(); });

    el.view.addEventListener('click', function (e) {
      var lot = e.target.closest('[data-lot]');
      if (lot) { S.sel = lot.dataset.lot; S.view = 'แดชบอร์ด'; render(); return; }

      var act = e.target.closest('[data-act]');
      if (!act) return;
      var s = current();
      if (act.dataset.act === 'exportReport') { exportReport(); return; }
      if (!s) return;
      if (act.dataset.act === 'addOk') {
        patch(s.id, function (x) { return Object.assign({}, x, { ok: x.ok + 1 }); });
      } else if (act.dataset.act === 'addNg') {
        S.events[s.id] = [{ ts: Date.now(), type: 'NG', ok: s.ok, ng: s.ng + 1, box: s.ngBox }]
          .concat(S.events[s.id] || []);
        patch(s.id, function (x) { return Object.assign({}, x, { ng: x.ng + 1 }); });
      }
      render();
    });
  }

  function tick() {
    S.clock = hhmm(new Date());
    S.st = S.st.map(function (s) {
      if (s.offline) return s;
      var locked = s.ng > s.ngBox;
      return Object.assign({}, s, {
        ok: locked ? s.ok : Math.min(s.ok + (Math.random() < s.rate / 12 ? 1 : 0), s.setting),
        lockSec: locked ? s.lockSec + 1 : 0
      });
    });
    render();
  }

  function initDownloads() {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    window.claude.use('downloads').then(function (dl) {
      hostDownloads = dl;
      if (!dl) {
        el.btnExport.hidden = true;
        var r = el.view.querySelector('[data-act="exportReport"]');
        if (r) r.hidden = true;
      }
    }, function () { el.btnExport.hidden = true; });
  }

  function boot() {
    try {
      var saved = JSON.parse(localStorage.getItem('okng-look') || 'null');
      if (saved) {
        if (saved.theme) S.theme = saved.theme;
        if (saved.font) S.font = saved.font;
        S.tv = !!saved.tv;
      }
    } catch (e) { /* ignore */ }
    el.theme.value = S.theme;
    el.font.value = S.font;
    applyLook();

    S.all = buildStations();
    S.st = S.all.slice();
    S.sel = S.st[0].id;
    S.st.forEach(function (s) { S.events[s.id] = seedEvents(s); });

    bind();
    render();
    initDownloads();
    setInterval(tick, 1000);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
